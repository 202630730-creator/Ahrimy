<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧸 웩! 아기 깨우지 마! (심야 정전 모드)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; padding: 0;
            background-color: #1a1025;
            font-family: 'Jua', sans-serif;
            color: #5a4b5c;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }
        #game-container {
            width: 100%; max-width: 500px;
            height: 100vh; max-height: 800px;
            background: #231b2e;
            display: flex; flex-direction: column;
            justify-content: space-between; align-items: center;
            padding: 12px; position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border-radius: 20px;
        }

        header {
            width: 100%; background: #2d223c; padding: 10px 14px;
            border-radius: 14px; border: 2px dashed #6b4682; z-index: 5;
            color: #f3d2e2;
        }
        .top-info {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 15px; margin-bottom: 6px;
        }
        .status-badge {
            padding: 3px 10px; border-radius: 10px; font-size: 13px; color: white;
        }
        .status-deep { background-color: #38a169; }
        .status-light { background-color: #dd6b20; }
        .status-danger { background-color: #e53e3e; animation: blink 0.3s infinite; }

        @keyframes blink { 50% { opacity: 0.3; } }

        .gauge-box {
            width: 100%; background: #1a202c; height: 16px;
            border-radius: 8px; overflow: hidden; border: 2px solid #4a5568;
        }
        #noise-bar {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #319795, #d69e2e, #e53e3e);
            transition: width 0.05s linear;
        }

        #room-viewport {
            position: relative;
            width: 100%; flex-grow: 1; margin: 8px 0;
            border-radius: 14px; overflow: hidden;
            border: 3px solid #4a335a;
            background-image: url('https://images.canvas.generated/watermarked_img_4285475024595357183.png');
            background-size: cover;
            background-position: center;
        }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        footer {
            width: 100%; text-align: center; font-size: 13px; color: #b794f4;
            background: #2d223c; padding: 8px; border-radius: 10px; z-index: 5;
        }

        .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(20, 15, 30, 0.95);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 100; padding: 25px; text-align: center; border-radius: 20px;
            color: #fff;
        }
        .overlay h1 { font-size: 26px; color: #fbb6ce; margin-bottom: 8px; }
        .overlay p { font-size: 14px; line-height: 1.5; color: #cbd5e0; margin-bottom: 15px; }
        .guide-box {
            background: #2d3748; padding: 12px; border-radius: 10px;
            text-align: left; font-size: 13px; margin-bottom: 15px;
            border: 2px solid #718096; width: 100%; color: #e2e8f0;
        }
        .start-btn {
            padding: 10px 30px; font-size: 18px; font-family: 'Jua', sans-serif;
            background: #d53f8c; color: white; border: none; border-radius: 20px;
            cursor: pointer; box-shadow: 0 4px 10px rgba(213, 63, 140, 0.4);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <header>
        <div class="top-info">
            <div>아기: <span id="baby-state" class="status-badge status-deep">😴 꿀잠</span></div>
            <div>⏱️ <span id="timer" style="color:#fc8181;">25</span>초 | ⚡ <span id="event-text" style="color:#f6e05e;">정상</span></div>
        </div>
        <div class="gauge-box">
            <div id="noise-bar"></div>
        </div>
    </header>

    <div id="room-viewport">
        <canvas id="gameCanvas" width="450" height="520"></canvas>
    </div>

    <footer>
        🎮 <b>[방향키/WASD]</b> 이동 | <b>[Shift]</b> 조용히 걷기
    </footer>

    <!-- 시작 화면 -->
    <div id="start-screen" class="overlay">
        <h1>⚡ 심야 정전 모드! (매우 어려움)</h1>
        <p>침대 위에서 뒤척이는 아기를 잘 관찰하세요!</p>
        <div class="guide-box">
            • <b>👶 아기의 상태:</b> 꿀잠 ➔ 뒤척이기(몸부림) ➔ **기척 파동(얼음!)**<br>
            • <b>⚡ 갑작스러운 정전:</b> 불이 꺼지면 발밑 시야만 살짝 보입니다!<br>
            • <b>💥 이동형 장난감:</b> 오리와 블록이 바닥에서 살짝씩 움직입니다.<br>
            • <b>⏱️ 25초 제한시간:</b> 지체할 시간이 없습니다!
        </div>
        <button class="start-btn" onclick="initGame()">악마 난이도 시작</button>
    </div>

    <!-- 엔딩 화면 -->
    <div id="end-screen" class="overlay hidden">
        <h1 id="end-title">게임 오버</h1>
        <p id="end-desc">아기가 깨어났습니다!</p>
        <button class="start-btn" onclick="initGame()">재도전</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let isPlaying = false;
let noiseLevel = 0;
let timeLeft = 25;
let timerInterval = null;
let isBlackout = false; // 정전 여부

const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, a: false, s: false, d: false, Shift: false };

const player = { x: 225, y: 470, radius: 14, speed: 3.0, sneakSpeed: 1.3 };

// 아기 객체 (침대 중앙 위치)
const baby = {
    x: 225, y: 220,
    state: 'DEEP', // DEEP, SENSITIVE, SCANNING
    timer: 0,
    scanRadius: 0,
    bodyAngle: 0 // 뒤척이는 애니메이션용
};

let items = [];
let obstacles = [];

window.addEventListener('keydown', e => { if (e.key in keys || ['w','a','s','d','Shift'].includes(e.key)) keys[e.key] = true; });
window.addEventListener('keyup', e => { if (e.key in keys || ['w','a','s','d','Shift'].includes(e.key)) keys[e.key] = false; });

function initGame() {
    isPlaying = true;
    noiseLevel = 0;
    timeLeft = 25;
    isBlackout = false;
    player.x = 225; player.y = 470;
    baby.state = 'DEEP'; baby.timer = 0; baby.scanRadius = 0;

    items = [
        { type: 'BOTTLE', x: 70, y: 340, r: 16, collected: false },
        { type: 'BEAR', x: 380, y: 140, r: 18, collected: false },
        { type: 'RATTLE', x: 370, y: 390, r: 16, collected: false }
    ];

    // 움직이는 장난감 장애물
    obstacles = [
        { type: 'DUCK', x: 140, y: 410, r: 16, vx: 0.8 },
        { type: 'BLOCKS', x: 310, y: 320, r: 18, vy: -0.6 },
        { type: 'DUCK', x: 110, y: 200, r: 16, vx: -0.7 },
        { type: 'BLOCKS', x: 300, y: 220, r: 18, vx: 0.5 }
    ];

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('end-screen').classList.add('hidden');
    document.getElementById('timer').textContent = timeLeft;

    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if (!isPlaying) return;
        timeLeft--;
        document.getElementById('timer').textContent = timeLeft;

        // 랜덤 정전 이벤트 발생 (8초~15초 사이)
        if (timeLeft === 18 || timeLeft === 8) {
            triggerBlackout();
        }

        if (timeLeft <= 0) gameOver(false, "⏰ 시간 초과! 아기가 깨어났습니다!");
    }, 1000);

    requestAnimationFrame(gameLoop);
}

function triggerBlackout() {
    isBlackout = true;
    document.getElementById('event-text').textContent = "🚨 정전!!";
    document.getElementById('event-text').style.color = "#e53e3e";
    setTimeout(() => {
        isBlackout = false;
        document.getElementById('event-text').textContent = "정상";
        document.getElementById('event-text').style.color = "#f6e05e";
    }, 3500); // 3.5초 후 복구
}

function gameLoop() {
    if (!isPlaying) return;
    update();
    render();
    requestAnimationFrame(gameLoop);
}

function update() {
    // 1. 아기 패턴 & 애니메이션
    baby.timer++;
    if (baby.state === 'DEEP') {
        baby.bodyAngle = Math.sin(baby.timer * 0.05) * 0.1; // 조용히 숨쉼
        if (baby.timer > 100) { baby.state = 'SENSITIVE'; baby.timer = 0; }
    } else if (baby.state === 'SENSITIVE') {
        baby.bodyAngle = Math.sin(baby.timer * 0.3) * 0.4; // 격하게 뒤척임!
        if (baby.timer > 60) { baby.state = 'SCANNING'; baby.timer = 0; baby.scanRadius = 0; }
    } else if (baby.state === 'SCANNING') {
        baby.scanRadius += 5; // 파동 급속 확대
        if (baby.scanRadius > 280) { baby.state = 'DEEP'; baby.timer = 0; }
    }
    updateUI();

    // 2. 이동 조작
    let isMoving = false;
    let isSneaking = keys.Shift;
    let speed = isSneaking ? player.sneakSpeed : player.speed;

    let dx = 0, dy = 0;
    if (keys.ArrowUp || keys.w) dy -= 1;
    if (keys.ArrowDown || keys.s) dy += 1;
    if (keys.ArrowLeft || keys.a) dx -= 1;
    if (keys.ArrowRight || keys.d) dx += 1;

    if (dx !== 0 || dy !== 0) {
        isMoving = true;
        let len = Math.sqrt(dx*dx + dy*dy);
        player.x += (dx/len) * speed;
        player.y += (dy/len) * speed;
    }

    player.x = Math.max(15, Math.min(canvas.width - 15, player.x));
    player.y = Math.max(15, Math.min(canvas.height - 15, player.y));

    // 3. 장애물 순찰 이동
    obstacles.forEach(obs => {
        if (obs.vx) {
            obs.x += obs.vx;
            if (obs.x < 50 || obs.x > 400) obs.vx *= -1;
        }
        if (obs.vy) {
            obs.y += obs.vy;
            if (obs.y < 150 || obs.y > 420) obs.vy *= -1;
        }

        // 충돌 감지
        if (Math.hypot(player.x - obs.x, player.y - obs.y) < player.radius + obs.r) {
            noiseLevel += 4.0;
        }
    });

    // 4. 소음 판정 (파동 검사)
    let noiseAdded = 0;
    if (baby.state === 'SCANNING') {
        let distToBaby = Math.hypot(player.x - baby.x, player.y - baby.y);
        if (Math.abs(distToBaby - baby.scanRadius) < 20 && isMoving) {
            noiseAdded += 18; // 파동 칠 때 움직이면 소음 대폭발
        }
    }

    if (isMoving) noiseAdded += isSneaking ? 0.1 : 0.6;

    noiseLevel += noiseAdded;
    if (!isMoving) noiseLevel -= 0.3;
    noiseLevel = Math.max(0, Math.min(100, noiseLevel));
    document.getElementById('noise-bar').style.width = `${noiseLevel}%`;

    // 5. 아이템 회수
    let leftCount = 0;
    items.forEach(item => {
        if (!item.collected) {
            if (Math.hypot(player.x - item.x, player.y - item.y) < player.radius + item.r) {
                item.collected = true;
            } else { leftCount++; }
        }
    });

    // 6. 게임 오버 조건
    if (noiseLevel >= 100) {
        gameOver(false, "💥 으앙~!! 아기가 깨어나 울음을 터뜨렸습니다!");
    } else if (leftCount === 0 && player.y > 450) {
        gameOver(true, "🎉 성공! 정전을 뚫고 미션을 완료했습니다!");
    }
}

function updateUI() {
    const badge = document.getElementById('baby-state');
    if (baby.state === 'DEEP') {
        badge.textContent = '😴 꿀잠';
        badge.className = 'status-badge status-deep';
    } else if (baby.state === 'SENSITIVE') {
        badge.textContent = '🥺 뒤척임!';
        badge.className = 'status-badge status-light';
    } else {
        badge.textContent = '⚠️ 기척 감지! (얼음!)';
        badge.className = 'status-badge status-danger';
    }
}

// ---------------- 🎨 그래픽 렌더링 ----------------

// 진짜 아기 그리기 (침대 위에서 뒤척임)
function drawBaby(x, y) {
    ctx.save();
    ctx.translate(x, y);

    // 침대 난간/배경
    ctx.fillStyle = '#eddcd2';
    ctx.beginPath(); ctx.roundRect(-45, -35, 90, 70, 10); ctx.fill();
    ctx.strokeStyle = '#b08968'; ctx.lineWidth = 3; ctx.stroke();

    // 이불
    ctx.fillStyle = '#a2d2ff';
    ctx.beginPath(); ctx.roundRect(-40, -10, 80, 40, 8); ctx.fill();

    // 아기 몸 (뒤척임 회전 적용)
    ctx.rotate(baby.bodyAngle);

    // 아기 머리
    ctx.fillStyle = '#ffdbac';
    ctx.beginPath(); ctx.arc(0, -18, 14, 0, Math.PI * 2); ctx.fill();

    // 아기 머리카락 한 가닥
    ctx.strokeStyle = '#7f5539'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, -32, 4, 0, Math.PI); ctx.stroke();

    // 얼굴 (상태별 표정)
    ctx.fillStyle = '#2b2d42';
    if (baby.state === 'DEEP') {
        // 감은 눈 (^^)
        ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('︶ ︶', 0, -16);
    } else if (baby.state === 'SENSITIVE') {
        // 눈살 찌푸림 (＞＜)
        ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('><', 0, -16);
    } else {
        // 눈 번쩍! (👀)
        ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('👀', 0, -16);
    }

    // 아기 볼터치
    ctx.fillStyle = 'rgba(255, 182, 193, 0.7)';
    ctx.beginPath(); ctx.arc(-7, -13, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(7, -13, 3, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
}

function drawBottle(x, y) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)'; ctx.strokeStyle = '#cbd5e0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(-8, -10, 16, 20, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f6ad55'; ctx.beginPath(); ctx.arc(0, -13, 5, Math.PI, 0); ctx.fill();
    ctx.restore();
}

function drawBear(x, y) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#b7791f';
    ctx.beginPath(); ctx.arc(-10, -10, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(10, -10, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -2, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2d3748';
    ctx.beginPath(); ctx.arc(-4, -4, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -4, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
}

function drawRattle(x, y) {
    ctx.save(); ctx.translate(x, y);
    ctx.strokeStyle = '#4299e1'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 14); ctx.stroke();
    ctx.fillStyle = '#ed64a6'; ctx.beginPath(); ctx.arc(0, -6, 10, 0, Math.PI*2); ctx.fill();
    ctx.restore();
}

function drawDuck(x, y) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#ecc94b'; ctx.beginPath(); ctx.ellipse(0, 2, 10, 7, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-5, -5, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ed8936'; ctx.beginPath(); ctx.arc(-10, -4, 3, 0, Math.PI*2); ctx.fill();
    ctx.restore();
}

function drawBlocks(x, y) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#4299e1'; ctx.fillRect(-10, 0, 10, 10);
    ctx.fillStyle = '#48bb78'; ctx.fillRect(0, 0, 10, 10);
    ctx.fillStyle = '#e53e3e'; ctx.fillRect(-5, -10, 10, 10);
    ctx.restore();
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. 침대 위 아기 그리기
    drawBaby(baby.x, baby.y);

    // 2. 기척 파동
    if (baby.state === 'SCANNING') {
        ctx.beginPath();
        ctx.arc(baby.x, baby.y, baby.scanRadius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(229, 62, 62, 0.8)';
        ctx.lineWidth = 4;
        ctx.stroke();
    }

    // 3. 움직이는 장애물
    obstacles.forEach(obs => {
        if (obs.type === 'DUCK') drawDuck(obs.x, obs.y);
        else if (obs.type === 'BLOCKS') drawBlocks(obs.x, obs.y);
    });

    // 4. 육아용품
    items.forEach(item => {
        if (!item.collected) {
            ctx.beginPath(); ctx.arc(item.x, item.y, item.r + 4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(237, 137, 54, 0.3)'; ctx.fill();

            if (item.type === 'BOTTLE') drawBottle(item.x, item.y);
            else if (item.type === 'BEAR') drawBear(item.x, item.y);
            else if (item.type === 'RATTLE') drawRattle(item.x, item.y);
        }
    });

    // 5. 플레이어 (발자국 캐릭터)
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.fillStyle = keys.Shift ? '#4FD1C5' : '#319795';
    ctx.beginPath(); ctx.ellipse(0, 2, 8, 10, 0, 0, Math.PI*2); ctx.fill();
    for (let i = -2; i <= 2; i++) {
        ctx.beginPath(); ctx.arc(i * 3.5, -9, 2, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();

    // 6. 탈출구
    ctx.fillStyle = 'rgba(72, 187, 120, 0.6)';
    ctx.beginPath(); ctx.roundRect(175, 485, 100, 30, 8); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '14px Jua'; ctx.fillText('🚪 탈출구', 225, 502);

    // 7. 정전 암전 스포트라이트 효과 (Blackout)
    if (isBlackout) {
        ctx.save();
        ctx.fillStyle = 'rgba(5, 5, 12, 0.94)';
        ctx.beginPath();
        ctx.rect(0, 0, canvas.width, canvas.height);
        // 플레이어 주변만 시야 구멍 뚫기
        ctx.arc(player.x, player.y, 65, 0, Math.PI * 2, true);
        ctx.fill();
        ctx.restore();
    }
}

function gameOver(isWin, msg) {
    isPlaying = false;
    clearInterval(timerInterval);
    const endScreen = document.getElementById('end-screen');
    const endTitle = document.getElementById('end-title');
    const endDesc = document.getElementById('end-desc');

    endTitle.textContent = isWin ? "🎉 미션 성공!" : "💥 미션 실패!";
    endTitle.style.color = isWin ? "#68d391" : "#fc8181";
    endDesc.textContent = msg;
    endScreen.classList.remove('hidden');
}
</script>
</body>
</html>
